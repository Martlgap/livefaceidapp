[project]
name = "livefaceidapp"
version = "0.1.0"
description = "Live webcam face recognition app using Gradio"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gradio>=5.0.0",
    "scikit-image>=0.21.0,<1.0.0",
    "scikit-learn>=1.3.2,<2.0.0",
    "opencv-python-headless",
    "watchdog>=4.0.2,<5.0.0",
    "onnxruntime>=1.19.2,<2.0.0",
    "mediapipe>=0.10.11,<1.0.0",
    "numpy>=1.24.4,<2.0.0",
    "memory-profiler>=0.61.0",
    "pillow>=10.4.0,<11.0.0",
]

[dependency-groups]
dev = []

[tool.black]
line-length = 120
